<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For My Kikkiii 🤍</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family: Georgia, "Times New Roman", serif;
  background:radial-gradient(circle at 50% 35%,#fff7fb 0,#ffddea 35%,#f6b6cf 72%,#d982a8 100%);
}
#app{position:relative;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}
#stage{
  position:relative;
  width:min(100vw, calc(100vh * 0.5625));
  height:min(100vh, calc(100vw / 0.5625));
  max-width:100vw;max-height:100vh;
  overflow:hidden;background:#fff;
  box-shadow:0 0 45px rgba(92,23,58,.28);
}
.slide{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  opacity:0;transform:scale(1.035);
  transition:opacity .75s ease,transform .9s ease;
  pointer-events:none;
}
.slide.active{opacity:1;transform:scale(1);pointer-events:auto}
#veil{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,185,215,.08));
}
#hearts{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.heart{
 position:absolute;bottom:-30px;font-size:18px;opacity:0;
 animation:floatUp linear forwards;
 filter:drop-shadow(0 3px 5px rgba(100,20,55,.18));
}
@keyframes floatUp{0%{transform:translateY(0) scale(.7) rotate(0);opacity:0}
12%{opacity:.9}100%{transform:translateY(-115vh) scale(1.15) rotate(22deg);opacity:0}}
#tap{
 position:absolute;z-index:10;left:50%;bottom:7%;
 transform:translateX(-50%);
 min-width:82px;height:82px;border-radius:50%;
 border:3px solid rgba(255,255,255,.92);
 background:radial-gradient(circle at 35% 30%,#fff,#ffe6f1 48%,#f6a8c9);
 box-shadow:0 0 0 8px rgba(255,255,255,.18),0 8px 28px rgba(110,22,65,.3);
 color:#8e2459;font-weight:700;font-size:14px;
 cursor:pointer;display:flex;align-items:center;justify-content:center;
 animation:pulse 1.7s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}
50%{transform:translateX(-50%) scale(1.08)}}
#tap.hidden{display:none}
#progress{position:absolute;z-index:11;top:10px;left:50%;transform:translateX(-50%);
 color:rgba(112,25,68,.55);font:12px Arial,sans-serif;letter-spacing:2px}
#cover{
 position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at center,#fff8fc 0,#ffd5e7 45%,#ec9fbd 100%);
 transition:opacity .8s ease;
}
#cover.hide{opacity:0;pointer-events:none}
.cover-card{text-align:center;padding:28px;color:#7e214f}
.cover-card .mini{font:14px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;opacity:.7}
.cover-card h1{font-size:clamp(28px,7vw,54px);margin:12px 0 8px}
.cover-card p{margin:0 0 24px;font-size:18px}
#open{border:0;border-radius:999px;padding:15px 28px;background:#fff;color:#9b2d60;
font-weight:700;box-shadow:0 8px 28px rgba(120,20,65,.22);cursor:pointer;font-size:16px}
#remove15{position:absolute;z-index:12;left:0;right:0;bottom:0;height:25%;background:rgba(255,255,255,.98);display:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="cover"><div class="cover-card">
      <div class="mini">A little birthday surprise</div>
      <h1>For my Kikkiii 🤍</h1>
      <p>Open it… 🎀</p>
      <button id="open">Open my heart 🤍</button>
    </div></div>
    <div id="progress"></div>
    <div id="hearts"></div>
    <img id="s1" class="slide active" src="slide-01.jpg" alt="">
    <div id="remove15"></div>
    <div id="tap">CLICK<br>ME 🤍</div>
  </div>
</div>
<script>
const total = 34;
let current = 1;
const stage = document.getElementById('stage');
const tap = document.getElementById('tap');
const cover = document.getElementById('cover');
const progress = document.getElementById('progress');
const hearts = document.getElementById('hearts');
const remove15 = document.getElementById('remove15');
let img = document.getElementById('s1');

function makeHearts(){
  const symbols=['❤','💗','🤍','🎀','✨'];
  for(let i=0;i<3;i++){
    const h=document.createElement('span');
    h.className='heart';
    h.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    h.style.left=(Math.random()*100)+'%';
    h.style.animationDuration=(5+Math.random()*5)+'s';
    h.style.fontSize=(14+Math.random()*15)+'px';
    hearts.appendChild(h);
    setTimeout(()=>h.remove(),11000);
  }
}
setInterval(makeHearts,900);

function update(){
  progress.textContent = current + ' / ' + total;
  tap.classList.toggle('hidden', current===total);
  // Mask the instructional text on slide 15 as requested.
  remove15.style.display = current===15 ? 'block' : 'none';
}
function next(){
  if(current>=total) return;
  current++;
  const nextImg=document.createElement('img');
  nextImg.className='slide';
  nextImg.src=`slide-${String(current).padStart(2,'0')}.jpg`;
  stage.appendChild(nextImg);
  requestAnimationFrame(()=>nextImg.classList.add('active'));
  img.classList.remove('active');
  setTimeout(()=>{if(img.parentNode)img.remove();img=nextImg},800);
  update();
  makeHearts();
}
document.getElementById('open').addEventListener('click',()=>{
  cover.classList.add('hide');
  setTimeout(()=>{cover.remove();},850);
});
tap.addEventListener('click',next);
stage.addEventListener('click',e=>{
  if(e.target===stage && current>1) next();
});
update();
</script>
</body>
</html>
